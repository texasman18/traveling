<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미국 서부 여행 3D 지도 애니메이션 v4</title>
<style>
:root{--bg:#f5f5f7;--ink:#1d1d1f;--sub:#6e6e73;--line:#e0e0e0;--card:#ffffff;--link:#0066cc}
@media (prefers-color-scheme:dark){:root{--bg:#000;--ink:#f5f5f7;--sub:#a1a1a6;--line:#2c2c2e;--card:#1c1c1e;--link:#2997ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
main{max-width:960px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:clamp(22px,4vw,32px);line-height:1.25;margin:0 0 6px}
p{margin:6px 0;color:var(--sub);font-size:14px}
video{display:block;width:100%;height:auto;margin:18px 0 12px;border-radius:12px;border:1px solid var(--line);background:#000}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px}
a{color:var(--link)}
</style>
</head>
<body>
<main>
<h1>미국 서부 여행 3D 지도 애니메이션 v4</h1>
